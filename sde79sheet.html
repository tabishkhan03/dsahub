<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>79 Sheet</title>
<style>
  :root {
    --bg: #06080f;
    --surface: #0d1120;
    --surface2: #141828;
    --border: #1e2540;
    --accent: #22d3ee;
    --accent2: #38bdf8;
    --text: #e0e8f8;
    --muted: #5a6a90;
    --done-bg: #051c20;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', 'Segoe UI', sans-serif; min-height: 100vh; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 1.3rem; font-weight: 700; }
  header h1 span { color: var(--accent); }
  .stat-pill { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; font-size: 0.85rem; color: var(--muted); }
  .stat-pill strong { color: var(--accent); }

  .search-bar { padding: 20px 32px 0; }
  .search-bar input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: var(--radius); font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--muted); }

  .filters { padding: 12px 32px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 5px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--accent); }

  main { padding: 20px 32px 60px; max-width: 1100px; margin: 0 auto; }

  .category { margin-bottom: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .category-header { padding: 14px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; transition: background 0.2s; }
  .category-header:hover { background: var(--surface2); }
  .cat-icon { width: 30px; height: 30px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; }
  .cat-title { font-weight: 600; font-size: 0.95rem; flex: 1; }
  .cat-meta { display: flex; align-items: center; gap: 10px; }
  .cat-progress { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .cat-arrow { color: var(--muted); transition: transform 0.25s; font-size: 0.75rem; }
  .category.open .cat-arrow { transform: rotate(90deg); }
  .progress-bar { width: 70px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.4s ease; }
  .category-body { display: none; border-top: 1px solid var(--border); }
  .category.open .category-body { display: block; }

  .problem-row { display: flex; align-items: center; gap: 14px; padding: 10px 20px; border-bottom: 1px solid #1e1e26; transition: background 0.15s; }
  .problem-row:last-child { border-bottom: none; }
  .problem-row:hover { background: #16161e; }
  .problem-row.done { background: var(--done-bg); }
  .problem-row.done .problem-name { text-decoration: line-through; color: var(--muted); }

  .check-btn { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
  .check-btn:hover { border-color: var(--accent); }
  .check-btn.checked { background: var(--accent); border-color: var(--accent); }
  .check-btn.checked::after { content: '✓'; color: white; font-size: 0.7rem; font-weight: 700; }

  .problem-name { flex: 1; font-size: 0.88rem; }

  .lc-link { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; background: #051c20; border: 1px solid #0e4050; border-radius: 6px; color: #22d3ee; font-size: 0.75rem; font-weight: 600; text-decoration: none; transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
  .lc-link:hover { background: rgba(34,211,238,0.08); border-color: #22d3ee; }
  .no-lc { color: var(--muted); font-size: 0.75rem; padding: 3px 10px; }

  .no-results { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 1rem; display: none; }
  .no-results.show { display: block; }
</style>
</head>
<body>

<header>
  <h1>79 <span>Sheet</span></h1>
  <div class="stat-pill">Completed: <strong id="done-count">0</strong> / <strong id="total-count">0</strong></div>
</header>

<div class="search-bar">
  <input type="text" id="searchBox" placeholder="🔍  Search questions..." oninput="doSearch()"/>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('done',this)">✅ Done</button>
  <button class="filter-btn" onclick="setFilter('pending',this)">⏳ Pending</button>
  <button class="filter-btn" onclick="setFilter('lc',this)">🟡 Has LeetCode</button>
</div>

<main id="main">
  <div class="no-results" id="no-results">No questions match your search.</div>
</main>

    { id:"dp10",name:"Best Time to Buy and Sell Stock IV", lc:"https://leetcode.com/problems/best-time-to-buy-and-sell-stock-iv/" },

  ]},
  { id:"664", name:"Tries", problems:[

  ]},

let activeFilter = 'all', searchTerm = '';
const KEY_PREFIX = 'sde79_done_';
function isDone(id) { return localStorage.getItem(KEY_PREFIX+id)==='1'; }
function setDone(id,v) { v ? localStorage.setItem(KEY_PREFIX+id,'1') : localStorage.removeItem(KEY_PREFIX+id); }

function buildUI() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let total=0, done=0;
  DATA.forEach((cat,ci) => {
    let ct=0, cd=0;
    cat.problems.forEach(p=>{ ct++; total++; if(isDone(p.id)){cd++;done++;} });
    const el = document.createElement('div');
    el.className='category'; el.id='cat-'+cat.id;
    const header = document.createElement('div');
    header.className='category-header';
    header.innerHTML=`
      <div class="cat-icon">${ICONS[ci%ICONS.length]}</div>
      <div class="cat-title">${ci+1}. ${cat.name}</div>
      <div class="cat-meta">
        <span class="cat-progress" id="cprog-${cat.id}">${cd}/${ct}</span>
        <div class="progress-bar"><div class="progress-fill" id="pfill-${cat.id}" style="width:${ct?Math.round(cd/ct*100):0}%"></div></div>
        <span class="cat-arrow">▶</span>
      </div>`;
    header.onclick=()=>el.classList.toggle('open');
    const body = document.createElement('div');
    body.className='category-body';
    cat.problems.forEach(p=>{
      const row=document.createElement('div');
      row.className='problem-row'+(isDone(p.id)?' done':'');
      row.id='row-'+p.id; row.dataset.name=p.name.toLowerCase(); row.dataset.haslc=p.lc?'1':'0';
      const check=document.createElement('div');
      check.className='check-btn'+(isDone(p.id)?' checked':'');
      check.onclick=e=>{e.stopPropagation();toggleDone(p.id,cat.id);};
      const name=document.createElement('span');
      name.className='problem-name'; name.textContent=p.name;
      const lc=p.lc
        ? Object.assign(document.createElement('a'),{href:p.lc,target:'_blank',rel:'noopener',className:'lc-link',innerHTML:'🟡 LeetCode'})
        : Object.assign(document.createElement('span'),{className:'no-lc',textContent:'—'});
      row.appendChild(check); row.appendChild(name); row.appendChild(lc);
      body.appendChild(row);
    });
    el.appendChild(header); el.appendChild(body);
    main.appendChild(el);
  });
  document.getElementById('total-count').textContent=total;
  document.getElementById('done-count').textContent=done;
  applyFilter();
}

function toggleDone(id,catId) {
  const was=isDone(id); setDone(id,!was);
  const row=document.getElementById('row-'+id);
  const check=row.querySelector('.check-btn');
  if(!was){row.classList.add('done');check.classList.add('checked');}
  else{row.classList.remove('done');check.classList.remove('checked');}
  updateCounts(); applyFilter();
}

function updateCounts() {
  let total=0,done=0;
  DATA.forEach(cat=>{
    let ct=0,cd=0;
    cat.problems.forEach(p=>{ct++;total++;if(isDone(p.id)){cd++;done++;}});
    const fill=document.getElementById('pfill-'+cat.id);
    if(fill) fill.style.width=(ct?Math.round(cd/ct*100):0)+'%';
    const prog=document.getElementById('cprog-'+cat.id);
    if(prog) prog.textContent=cd+'/'+ct;
  });
  document.getElementById('total-count').textContent=total;
  document.getElementById('done-count').textContent=done;
}

function setFilter(f,btn) {
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); applyFilter();
}

function doSearch() { searchTerm=document.getElementById('searchBox').value.toLowerCase().trim(); applyFilter(); }

function applyFilter() {
  let any=false;
  document.querySelectorAll('.problem-row').forEach(row=>{
    const nm=row.dataset.name||'', lc=row.dataset.haslc==='1', dn=row.classList.contains('done');
    let show=true;
    if(searchTerm && !nm.includes(searchTerm)) show=false;
    if(activeFilter==='done' && !dn) show=false;
    if(activeFilter==='pending' && dn) show=false;
    if(activeFilter==='lc' && !lc) show=false;
    row.style.display=show?'':'none';
    if(show) any=true;
  });
  document.getElementById('no-results').classList.toggle('show',!any&&(searchTerm||activeFilter!=='all'));
}

buildUI();
</script>
</body>
</html>
