<style>
  :root {
    --bg: #06080f;
    --surface: #0d1120;
    --surface2: #141828;
    --border: #1e2540;
    --accent: #22d3ee;
    --accent2: #38bdf8;
    --text: #e0e8f8;
    --muted: #5a6a90;
    --easy: #22c55e;
    --medium: #f59e0b;
    --hard: #ef4444;
    --done-bg: #051c20;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', 'Segoe UI', sans-serif; min-height: 100vh; }

  /* Header */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
  header h1 { font-size: 1.3rem; font-weight: 700; color: var(--text); }
  header h1 span { color: var(--accent); }
  .stats { display: flex; gap: 20px; align-items: center; font-size: 0.85rem; color: var(--muted); }
  .stat-pill { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; }
  .stat-pill strong { color: var(--accent); }

  /* Search */
  .search-bar { padding: 20px 32px 0; }
  .search-bar input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: var(--radius); font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--muted); }

  /* Filters */
  .filters { padding: 12px 32px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 5px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--accent); }

  /* Main content */
  main { padding: 20px 32px 60px; max-width: 1200px; margin: 0 auto; }

  /* Category block */
  .category { margin-bottom: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .category-header { padding: 14px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; transition: background 0.2s; }
  .category-header:hover { background: var(--surface2); }
  .cat-icon { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
  .cat-title { font-weight: 600; font-size: 1rem; flex: 1; }
  .cat-progress { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .cat-arrow { color: var(--muted); transition: transform 0.25s; font-size: 0.8rem; }
  .category.open .cat-arrow { transform: rotate(90deg); }
  .category-body { display: none; border-top: 1px solid var(--border); }
  .category.open .category-body { display: block; }

  /* Subcategory */
  .subcategory { border-bottom: 1px solid var(--border); }
  .subcategory:last-child { border-bottom: none; }
  .subcat-header { padding: 10px 20px 10px 52px; display: flex; align-items: center; gap: 10px; cursor: pointer; background: var(--surface2); user-select: none; transition: background 0.2s; }
  .subcat-header:hover { filter: brightness(1.1); }
  .subcat-title { font-size: 0.88rem; font-weight: 500; color: var(--muted); flex: 1; }
  .subcat-count { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .subcat-arrow { color: var(--muted); transition: transform 0.25s; font-size: 0.72rem; }
  .subcategory.open .subcat-arrow { transform: rotate(90deg); }
  .problem-list { display: none; }
  .subcategory.open .problem-list { display: block; }

  /* Problem row */
  .problem-row { display: flex; align-items: center; gap: 14px; padding: 10px 20px 10px 52px; border-bottom: 1px solid #1e1e26; transition: background 0.15s; }
  .problem-row:last-child { border-bottom: none; }
  .problem-row:hover { background: #080e1c; }
  .problem-row.done { background: var(--done-bg); }
  .problem-row.done .problem-name { text-decoration: line-through; color: var(--muted); }

  /* Checkbox */
  .check-btn { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
  .check-btn:hover { border-color: var(--accent); }
  .check-btn.checked { background: var(--accent); border-color: var(--accent); }
  .check-btn.checked::after { content: '✓'; color: white; font-size: 0.7rem; font-weight: 700; }

  /* Problem name */
  .problem-name { flex: 1; font-size: 0.88rem; color: var(--text); }

  /* LeetCode badge */
  .lc-link { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; background: #051c20; border: 1px solid #0e4050; border-radius: 6px; color: #22d3ee; font-size: 0.75rem; font-weight: 600; text-decoration: none; transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
  .lc-link:hover { background: rgba(34,211,238,0.08); border-color: #22d3ee; }
  .no-lc { color: var(--muted); font-size: 0.75rem; padding: 3px 10px; }

  /* Progress bar */
  .progress-bar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.4s ease; }

  /* Empty search */
  .no-results { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 1rem; display: none; }
  .no-results.show { display: block; }
</style>
</head>

// --- State ---
let activeFilter = 'all';
let searchTerm = '';

function getKey(id) { return 'a2z_done_' + id; }
function isDone(id) { return localStorage.getItem(getKey(id)) === '1'; }
function setDone(id, val) { val ? localStorage.setItem(getKey(id), '1') : localStorage.removeItem(getKey(id)); }

// --- Build UI ---
function buildUI() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let totalProblems = 0, doneProblems = 0;

  DATA.forEach((cat, ci) => {
    const catEl = document.createElement('div');
    catEl.className = 'category';
    catEl.id = 'cat-' + cat.id;

    let catTotal = 0, catDone = 0;
    cat.subcategories.forEach(sub => {
      sub.problems.forEach(p => {
        catTotal++;
        totalProblems++;
        if (isDone(p.id)) { catDone++; doneProblems++; }
      });
    });

    const catHeader = document.createElement('div');
    catHeader.className = 'category-header';
    catHeader.innerHTML = `
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-title">${ci+1}. ${cat.name}</div>
      <div class="cat-progress">${catDone}/${catTotal}</div>
      <div style="width:80px;margin-left:10px"><div class="progress-bar"><div class="progress-fill" id="pfill-${cat.id}" style="width:${catTotal?Math.round(catDone/catTotal*100):0}%"></div></div></div>
      <span class="cat-arrow">▶</span>`;
    catHeader.onclick = () => { catEl.classList.toggle('open'); };

    const catBody = document.createElement('div');
    catBody.className = 'category-body';

    cat.subcategories.forEach((sub, si) => {
      const subEl = document.createElement('div');
      subEl.className = 'subcategory';
      subEl.id = 'sub-' + sub.id;

      const subHeader = document.createElement('div');
      subHeader.className = 'subcat-header';
      subHeader.innerHTML = `<span class="subcat-arrow">▶</span><span class="subcat-title">${sub.name}</span><span class="subcat-count">${sub.problems.length} problems</span>`;
      subHeader.onclick = () => { subEl.classList.toggle('open'); };

      const problemList = document.createElement('div');
      problemList.className = 'problem-list';

      sub.problems.forEach(p => {
        const row = document.createElement('div');
        row.className = 'problem-row' + (isDone(p.id) ? ' done' : '');
        row.id = 'row-' + p.id;
        row.dataset.name = p.name.toLowerCase();
        row.dataset.haslc = p.lc ? '1' : '0';

        const check = document.createElement('div');
        check.className = 'check-btn' + (isDone(p.id) ? ' checked' : '');
        check.title = 'Mark as done';
        check.onclick = (e) => { e.stopPropagation(); toggleDone(p.id, cat.id, sub.id); };

        const nameSpan = document.createElement('span');
        nameSpan.className = 'problem-name';
        nameSpan.textContent = p.name;

        const lcEl = p.lc
          ? Object.assign(document.createElement('a'), { href: p.lc, target: '_blank', rel: 'noopener', className: 'lc-link', innerHTML: '🟡 LeetCode' })
          : Object.assign(document.createElement('span'), { className: 'no-lc', textContent: '—' });

        row.appendChild(check);
        row.appendChild(nameSpan);
        row.appendChild(lcEl);
        problemList.appendChild(row);
      });

      subEl.appendChild(subHeader);
      subEl.appendChild(problemList);
      catBody.appendChild(subEl);
    });

    catEl.appendChild(catHeader);
    catEl.appendChild(catBody);
    main.appendChild(catEl);
  });

  document.getElementById('total-count').textContent = totalProblems;
  document.getElementById('done-count').textContent = doneProblems;
  applyFilter();
}

function toggleDone(id, catId, subId) {
  const was = isDone(id);
  setDone(id, !was);
  const row = document.getElementById('row-' + id);
  const check = row.querySelector('.check-btn');
  if (!was) { row.classList.add('done'); check.classList.add('checked'); }
  else       { row.classList.remove('done'); check.classList.remove('checked'); }
  updateCounts();
  applyFilter();
}

function updateCounts() {
  let total = 0, done = 0;
  DATA.forEach(cat => {
    let catTotal = 0, catDone = 0;
    cat.subcategories.forEach(sub => {
      sub.problems.forEach(p => {
        total++; catTotal++;
        if (isDone(p.id)) { done++; catDone++; }
      });
    });
    const fill = document.getElementById('pfill-' + cat.id);
    if (fill) fill.style.width = (catTotal ? Math.round(catDone/catTotal*100) : 0) + '%';
    const catEl = document.getElementById('cat-' + cat.id);
    if (catEl) {
      const prog = catEl.querySelector('.cat-progress');
      if (prog) prog.textContent = catDone + '/' + catTotal;
    }
  });
  document.getElementById('total-count').textContent = total;
  document.getElementById('done-count').textContent = done;
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
}

function doSearch() {
  searchTerm = document.getElementById('searchBox').value.toLowerCase().trim();
  applyFilter();
}

function applyFilter() {
  let anyVisible = false;
  const rows = document.querySelectorAll('.problem-row');
  rows.forEach(row => {
    const name = row.dataset.name || '';
    const haslc = row.dataset.haslc === '1';
    const done = row.classList.contains('done');
    let show = true;
    if (searchTerm && !name.includes(searchTerm)) show = false;
    if (activeFilter === 'done' && !done) show = false;
    if (activeFilter === 'pending' && done) show = false;
    if (activeFilter === 'lc' && !haslc) show = false;
    row.style.display = show ? '' : 'none';
    if (show) anyVisible = true;
  });
  document.getElementById('no-results').classList.toggle('show', !anyVisible && (searchTerm || activeFilter !== 'all'));
}

buildUI();
